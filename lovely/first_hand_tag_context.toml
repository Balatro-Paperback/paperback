[manifest]
version = "1.0.0"
priority = 0

# trigger tags with paperback_first_hand context once the first hand is drawn
[[patches]]
[patches.pattern]
target = 'game.lua'
match_indent = true
position = 'after'
pattern = '''
-- removed first hand drawn context
'''
payload = '''
G.E_MANAGER:add_event(Event({
    trigger = 'immediate',
    func = function()
        for k, v in ipairs(G.GAME.tags) do
            v:apply_to_run({type = 'paperback_first_hand'})
        end
        return true
    end
}))
'''
